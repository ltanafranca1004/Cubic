# Backend on Render (free web service). Render injects PORT itself.
# The free tier sleeps after 15 minutes idle; a cold start takes about 50 seconds.
services:
  - type: web
    name: cubic-server
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start -w server
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # Allowed browser origins, comma-separated, "*" allowed inside a host:
      # https://cubic.vercel.app,https://cubic-*.vercel.app,https://cubic.tech
      - key: CLIENT_ORIGIN
        sync: false
      # --- Inactivity: ms without any activity before the countdown, and how long it runs
      - key: INACTIVE_MS
        value: "240000"
      - key: INACTIVE_WARN_MS
        value: "60000"
      # --- AI partner
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: AI_FAKE # set to 1 to use the scripted partner (no Gemini)
        value: "0"
      - key: AI_PERSONA # default | tsundere
        value: default
      # --- AI partner voice
      - key: TTS_MODE # browser | elevenlabs
        value: elevenlabs
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: ELEVENLABS_MODEL_ID
        value: eleven_flash_v2_5
      # --- Voice: TURN relay for calls that cannot connect directly (optional, see README)
      - key: TURN_URLS # comma-separated turn:/turns: URLs
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
